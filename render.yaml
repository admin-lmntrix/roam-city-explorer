# Render Blueprint: New + → Blueprint → pick this repo. Creates the web service and a Postgres database.
services:
  - type: web
    name: roam
    runtime: node
    buildCommand: npm ci && npm run build:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase: { name: roam-db, property: connectionString }
      - key: AUTH_SECRET
        generateValue: true
databases:
  - name: roam-db
    databaseName: city_explorer
