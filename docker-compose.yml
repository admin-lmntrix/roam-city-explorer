# One-command local/production-like stack:  AUTH_SECRET=$(openssl rand -base64 32) docker compose up --build
# Then seed once:  docker compose exec web npm run db:seed
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: roam
      POSTGRES_PASSWORD: roam
      POSTGRES_DB: city_explorer
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roam -d city_explorer"]
      interval: 3s
      retries: 20
  web:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://roam:roam@db:5432/city_explorer
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (openssl rand -base64 32)}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
volumes:
  pgdata:
